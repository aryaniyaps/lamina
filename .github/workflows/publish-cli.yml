name: Publish Lamina CLI

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'cli-v')
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - uses: astral-sh/setup-uv@v9.0.0

      - name: Verify release identity
        run: |
          node scripts/check-cli-release-tag.mjs "${{ github.event.release.tag_name }}"
          node -e "const [a,b,c] = process.argv[1].split('.').map(Number); if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) process.exit(1)" "$(npm --version)"

      - name: Frozen install
        run: corepack pnpm install --frozen-lockfile

      - name: Test repository, CLI, and skill compatibility
        run: |
          corepack pnpm test
          corepack pnpm test:eval:spec
          corepack pnpm test:eval:validate
          corepack pnpm test:eval:compat

      - name: Pack and audit exact publication contents
        id: pack
        run: |
          mkdir -p dist
          npm pack ./packages/cli --json --pack-destination dist > cli-pack.json
          node scripts/audit-cli-pack.mjs cli-pack.json > cli-audit.json
          TARBALL="$(node -p "'./dist/' + require('./cli-audit.json').filename")"
          VERSION="$(node -p "require('./cli-audit.json').version")"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install tarball in a clean fixture
        run: node tests/cli_tarball_smoke_test.mjs --tarball "${{ steps.pack.outputs.tarball }}"

      - name: Publish through npm trusted publishing
        run: npm publish "${{ steps.pack.outputs.tarball }}" --access public --provenance

      - name: Verify registry package and provenance
        run: |
          for attempt in $(seq 1 24); do
            if npm view "@laminadev/cli@${{ steps.pack.outputs.version }}" --json; then
              break
            fi
            if [ "$attempt" -eq 24 ]; then
              echo "Registry package was not visible after 120 seconds." >&2
              exit 1
            fi
            sleep 5
          done
          node tests/cli_tarball_smoke_test.mjs --package "@laminadev/cli@${{ steps.pack.outputs.version }}"
          mkdir registry-audit
          cd registry-audit
          npm init -y
          node -e "const fs=require('fs'); const p=require('./package.json'); p.allowScripts={'@ladybugdb/core@0.18.3':true}; fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\\n')"
          npm install "@laminadev/cli@${{ steps.pack.outputs.version }}"
          npm audit signatures
