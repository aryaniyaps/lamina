name: Publish Lamina standalone CLI

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    if: startsWith(github.event.release.tag_name, 'cli-v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: darwin-arm64
          - runner: macos-13
            target: darwin-x64
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: windows-2025
            target: win32-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: corepack pnpm install --frozen-lockfile
      - name: Verify release identity and source contracts
        run: |
          node scripts/check-cli-release-tag.mjs "${{ github.event.release.tag_name }}"
          corepack pnpm test:cli
          node tests/transactional_graph_test.mjs
          node tests/graphd_protocol_test.mjs
          node tests/graphd_long_socket_test.mjs
      - name: Build native executable
        env:
          LAMINA_SEA_TARGET: ${{ matrix.target }}
        run: node scripts/build-standalone-cli.mjs
      - name: Verify isolated native assets
        env:
          LAMINA_BINARY: dist/lamina-${{ matrix.target }}${{ runner.os == 'Windows' && '.exe' || '' }}
          LAMINA_WORKER: dist/lamina-cocoindex-worker-${{ matrix.target }}${{ runner.os == 'Windows' && '.exe' || '' }}
        run: node tests/cli_binary_smoke_test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: lamina-${{ matrix.target }}
          path: dist/lamina-*

  release-assets:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Add checksums and installers
        run: |
          chmod +x scripts/install.sh
          cp scripts/install.sh dist/install.sh
          cp scripts/install.ps1 dist/install.ps1
          cd dist
          sha256sum lamina-* > SHA256SUMS
      - name: Verify Linux release installer and checksum rejection
        env:
          LAMINA_RELEASE_DIR: ${{ github.workspace }}/dist
        run: node tests/release_artifact_smoke_test.mjs
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
