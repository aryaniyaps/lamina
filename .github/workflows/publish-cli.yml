name: Publish Lamina standalone CLI

on:
  push:
    tags:
      - 'cli-v*'

permissions:
  contents: write

jobs:
  adapter-qualification:
    if: startsWith(github.ref_name, 'cli-v')
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Require a production crash-safe adapter before any dependency or test work
        run: npm run safe:self-test -- --require-production
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: npm run safe:run -- --tier small --workload release-qualification --report .lamina-safe-runner/install.json -- corepack pnpm install --frozen-lockfile
      - name: Verify release identity and cross-platform source contracts
        run: |
          node scripts/check-cli-release-tag.mjs "${{ github.ref_name }}"
          node scripts/check-cli-version-discipline.mjs
          npm run safe:run -- --tier small --workload release-qualification --report .lamina-safe-runner/test-cli.json -- corepack pnpm test:cli
          npm run safe:run -- --tier small --workload release-qualification --report .lamina-safe-runner/transactional-graph.json -- node tests/transactional_graph_test.mjs
          npm run safe:run -- --tier small --workload release-qualification --report .lamina-safe-runner/graphd-protocol.json -- node tests/graphd_protocol_test.mjs
          npm run safe:run -- --tier small --workload release-qualification --report .lamina-safe-runner/graphd-long-socket.json -- node tests/graphd_long_socket_test.mjs

  build:
    if: startsWith(github.ref_name, 'cli-v')
    needs: adapter-qualification
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: windows-2025
            target: win32-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: corepack pnpm install --frozen-lockfile
      - name: Verify release identity and source contracts
        run: |
          node scripts/check-cli-release-tag.mjs "${{ github.ref_name }}"
          node scripts/check-cli-version-discipline.mjs
          corepack pnpm test:cli
          node tests/transactional_graph_test.mjs
          node tests/graphd_protocol_test.mjs
          node tests/graphd_long_socket_test.mjs
      - name: Build native executable
        env:
          LAMINA_SEA_TARGET: ${{ matrix.target }}
        run: npm run safe:run -- --tier small --workload release-${{ matrix.target }} --report .lamina-safe-runner/build-${{ matrix.target }}.json -- node scripts/build-standalone-cli.mjs
      - name: Verify isolated native assets
        run: npm run safe:run -- --tier small --workload release-${{ matrix.target }} --report .lamina-safe-runner/fetch-model-${{ matrix.target }}.json -- node scripts/fetch-retrieval-model.mjs
      - name: Prepare frozen hybrid retrieval assets
        run: npm run safe:run -- --tier small --workload release-${{ matrix.target }} --report .lamina-safe-runner/prepare-retrieval-${{ matrix.target }}.json -- node scripts/prepare-retrieval-assets.mjs dist/retrieval-benchmark-runtime
      - name: Qualify frozen hybrid retrieval on enforced Linux
        if: runner.os == 'Linux'
        env:
          LAMINA_RETRIEVAL_TOKENIZER_PATH: ${{ github.workspace }}/dist/retrieval-benchmark-runtime/tokenizer.json
          LAMINA_RETRIEVAL_FTS_EXTENSION_PATH: ${{ github.workspace }}/dist/retrieval-benchmark-runtime/extensions/fts.lbug_extension
          LAMINA_RETRIEVAL_VECTOR_EXTENSION_PATH: ${{ github.workspace }}/dist/retrieval-benchmark-runtime/extensions/vector.lbug_extension
        run: |
          npm run safe:self-test -- --require-production
          npm run safe:run -- --tier small --workload retrieval-v1 --report .lamina-safe-runner/retrieval-native-index.json -- node tests/retrieval_native_index_test.mjs
          npm run safe:run -- --tier small --workload retrieval-v1 --promote --report .lamina-safe-runner/retrieval-calibrate.json -- node benchmarks/retrieval-v1/benchmark.mjs --calibrate --model dist/lamina-retrieval-model-int8-v1.onnx --tokenizer dist/retrieval-benchmark-runtime/tokenizer.json --model-digest ed45870251c9f0cf656e78aab0d37a23489066df8a222bb1c8caf8a45f2cb16d
          npm run safe:run -- --tier medium --workload retrieval-v1 --promote --report .lamina-safe-runner/retrieval-evaluate.json -- node benchmarks/retrieval-v1/benchmark.mjs --evaluate --model dist/lamina-retrieval-model-int8-v1.onnx --tokenizer dist/retrieval-benchmark-runtime/tokenizer.json --model-digest ed45870251c9f0cf656e78aab0d37a23489066df8a222bb1c8caf8a45f2cb16d
      - name: Smoke-test isolated native assets
        env:
          LAMINA_BINARY: ${{ github.workspace }}/dist/lamina-${{ matrix.target }}${{ runner.os == 'Windows' && '.exe' || '' }}
          LAMINA_WORKER: ${{ github.workspace }}/dist/lamina-cocoindex-worker-${{ matrix.target }}${{ runner.os == 'Windows' && '.exe' || '' }}
          LAMINA_MODEL: ${{ github.workspace }}/dist/lamina-retrieval-model-int8-v1.onnx
        run: node tests/cli_binary_smoke_test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: lamina-${{ matrix.target }}
          path: |
            dist/lamina-${{ matrix.target }}${{ runner.os == 'Windows' && '.exe' || '' }}
            dist/lamina-cocoindex-worker-${{ matrix.target }}${{ runner.os == 'Windows' && '.exe' || '' }}

  release-assets:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Add checksums and installers
        run: |
          chmod +x scripts/install.sh
          cp scripts/install.sh dist/install.sh
          cp scripts/install.ps1 dist/install.ps1
          node scripts/fetch-retrieval-model.mjs
          cd dist
          sha256sum lamina-* > SHA256SUMS
      - name: Verify Linux release installer and checksum rejection
        env:
          LAMINA_RELEASE_DIR: ${{ github.workspace }}/dist
        run: node tests/release_artifact_smoke_test.mjs
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
